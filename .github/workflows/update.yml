name: Update M3U Playlist

on:
  schedule:
    - cron: "0 22 * * *"
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-playlist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download playlist
        run: |
          curl -L --fail --retry 3 \
            "https://iptv.yang-1989.xyz/playlist.m3u" \
            -o playlist.m3u.new

      - name: Validate playlist
        run: |
          test -s playlist.m3u.new
          grep -q "^#EXTM3U" playlist.m3u.new
          grep -q "^#EXTINF" playlist.m3u.new

      - name: Replace playlist
        run: |
          mv playlist.m3u.new playlist.m3u
          ls -lh playlist.m3u

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add playlist.m3u

          if git diff --cached --quiet; then
            echo "Playlist has not changed."
          else
            git commit -m "Update M3U playlist"
            git push
          fi

```yaml
name: Update M3U Playlist

on:
  schedule:
    # 每天 06:00
    # UTC 22:00（前一天）
    - cron: "0 22 * * *"

    # 每天 18:00
    # UTC 10:00
    - cron: "0 10 * * *"

  # 允许在 GitHub Actions 页面手动运行
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-playlist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download latest playlist
        shell: bash
        run: |
          set -euo pipefail

          URL="https://iptv.yang-1989.xyz/playlist.m3u"
          TEMP_FILE="playlist.m3u.tmp"

          echo "Downloading latest playlist..."
          echo "Source: $URL"

          rm -f "$TEMP_FILE"

          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            --retry 3 \
            --retry-delay 5 \
            --connect-timeout 30 \
            --max-time 300 \
            --max-filesize 100M \
            "$URL" \
            -o "$TEMP_FILE"

          echo "Download completed."

      - name: Validate playlist
        shell: bash
        run: |
          set -euo pipefail

          FILE="playlist.m3u.tmp"

          # 文件不能为空
          if [ ! -s "$FILE" ]; then
            echo "ERROR: Downloaded file is empty."
            rm -f "$FILE"
            exit 1
          fi

          # 必须包含标准 M3U 文件头
          if ! grep -q "^#EXTM3U" "$FILE"; then
            echo "ERROR: Downloaded file does not appear to be a valid M3U playlist."
            echo "First 20 lines of downloaded file:"
            head -n 20 "$FILE"
            rm -f "$FILE"
            exit 1
          fi

          # 至少需要一个频道
          CHANNEL_COUNT=$(grep -c "^#EXTINF" "$FILE" || true)

          echo "Playlist validation passed."
          echo "Channel entries: $CHANNEL_COUNT"

          if [ "$CHANNEL_COUNT" -lt 1 ]; then
            echo "ERROR: No channel entries found."
            rm -f "$FILE"
            exit 1
          fi

      - name: Replace playlist
        shell: bash
        run: |
          set -euo pipefail

          mv playlist.m3u.tmp playlist.m3u

          echo "playlist.m3u has been updated."

      - name: Check for changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- playlist.m3u; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Playlist content has not changed."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Playlist content has changed."
          fi

      - name: Commit and push updated playlist
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add playlist.m3u

          git commit -m "Update playlist"

          git push

      - name: No changes
        if: steps.changes.outputs.changed == 'false'
        run: |
          echo "No changes detected. Nothing to commit."
```
